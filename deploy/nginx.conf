# Example for Nginx installed on the Docker host. Replace the domain.
# Add TLS using your certificate manager before exposing authentication publicly.
upstream universal_backend {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;

    # Allows ten files of 5 MiB plus multipart overhead. Keep in sync with
    # UPLOAD_MAX_BYTES and the application's ten-file limit.
    client_max_body_size 55m;

    location / {
        proxy_pass http://universal_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite client-supplied forwarding headers at this trusted boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
