x-runtime: &runtime
  image: ${DOCKER_IMAGE:-universal-backend:local}
  build:
    context: .
    target: runtime
  restart: unless-stopped
  env_file: .env
  environment: &runtime-env
    NODE_ENV: production
    PORT: 8000
    HOST: 0.0.0.0
    DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?schema=public
    REDIS_HOST: redis
    REDIS_PORT: 6379
    TRUST_PROXY_HOPS: 1
    SWAGGER_ENABLED: "false"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ${DOCKER_IMAGE:-universal-backend:local}-tools
    build:
      context: .
      target: tools
    profiles: [tools]
    env_file: .env
    environment: *runtime-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    command: ["pnpm", "db:deploy"]

  api:
    <<: *runtime
    # Only the host reverse proxy can reach this published port.
    ports: ["127.0.0.1:8081:8000"]

  worker:
    <<: *runtime
    command: ["node", "dist/src/worker.js"]
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis_data:
networks:
  backend:
